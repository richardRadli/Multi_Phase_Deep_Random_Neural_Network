services:
  redis_broker:
    image: "redis:alpine"
    ports:
      - "6379:6379"

  fcnn-api:
    build:
      context: ../..
      dockerfile: services/training_and_evaluation/Dockerfile
    ports:
      - "8001:8001"
    command: uvicorn services.training_and_evaluation.main:app --host 0.0.0.0 --port 8001
    environment:
      - CELERY_BROKER_URL=redis://redis_broker:6379/0
      - CELERY_RESULT_BACKEND=redis://redis_broker:6379/0
      - PROJECT_ROOT=/app
      - DATASET_ROOT=/app/datasets
      - STORAGE_ROOT=/app/storage
    depends_on:
      - redis_broker
    volumes:
      - C:/Users/hmark/Documents/Datasets/datasets:/app/datasets
      - D:/storage/lion17:/app/storage

  fcnn-worker:
    build:
      context: ../..
      dockerfile: services/training_and_evaluation/Dockerfile
    command: celery -A services.training_and_evaluation.tasks.celery_app worker --loglevel=info -P solo
    environment:
      - CELERY_BROKER_URL=redis://redis_broker:6379/0
      - CELERY_RESULT_BACKEND=redis://redis_broker:6379/0
      - PROJECT_ROOT=/app
      - DATASET_ROOT=/app/datasets
      - STORAGE_ROOT=/app/storage
    depends_on:
      - redis_broker
    volumes:
      - C:/Users/hmark/Documents/Datasets/datasets:/app/datasets
      - D:/storage/lion17:/app/storage